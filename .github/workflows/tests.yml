name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        dependency-set: [min-supported, latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.dependency-set }}" = "min-supported" ]; then
            if [ "${{ matrix.python-version }}" = "3.10" ]; then
              ASTROPY_SPEC="astropy==6.1.*"
            else
              ASTROPY_SPEC="astropy==7.2.*"
            fi
            pip install "numpy==2.0.*" "${ASTROPY_SPEC}"
          else
            pip install --upgrade numpy astropy matplotlib requests beautifulsoup4
          fi
          pip install -e ".[download,plot]"
          pip install pytest pytest-cov ruff mypy

      - name: Run tests
        run: |
          pytest -q

      - name: Generate coverage report
        if: matrix.python-version == '3.11' && matrix.dependency-set == 'latest'
        run: |
          pytest --cov=ecallistolib --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.python-version == '3.11' && matrix.dependency-set == 'latest'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff mypy

      - name: Run ruff
        run: ruff check src/ tests/

      - name: Run mypy
        run: mypy src/ecallistolib --ignore-missing-imports --disable-error-code=import-untyped
