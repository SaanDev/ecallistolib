[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecallistolib"
version = "1.1.0"
description = "Tools to download, read, process, and plot e-CALLISTO FITS dynamic spectra."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = {text = "MIT"}
authors = [{name = "Sahan S. Liyanage"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "numpy>=1.23",
  "astropy>=6.1.7; python_version<'3.11'",
  "astropy>=7.2; python_version>='3.11'",
]

[project.optional-dependencies]
download = ["requests>=2.31", "beautifulsoup4>=4.12"]
plot = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/saandev/ecallistolib"
Issues = "https://github.com/saandev/ecallistolib/issues"
